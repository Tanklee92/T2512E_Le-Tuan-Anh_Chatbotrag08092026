<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Demo AI Real-Time Streaming (SSE)</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f4f4f9; }
        .chat-box { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 80px; padding: 10px; box-sizing: border-box; }
        button { margin-top: 10px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #output { margin-top: 20px; padding: 15px; background: #eef2f5; border-radius: 4px; white-space: pre-wrap; line-height: 1.5; min-height: 100px; }
    </style>
</head>
<body>
<div class="chat-box">
    <h2>Trợ Lý AI Streaming (Buổi 4)</h2>
    <textarea id="promptInput" placeholder="Nhập câu hỏi tại đây..."></textarea>
    <button onclick="sendPrompt()">Gửi Câu Hỏi</button>
    <h3>Phản hồi Real-time:</h3>
    <div id="output"></div>
</div>

<script>
    async function sendPrompt() {
        const prompt = document.getElementById('promptInput').value;
        const outputDiv = document.getElementById('output');
        outputDiv.innerText = ''; // Clear nội dung cũ

        if (!prompt.trim()) return;

        try {
            // Gọi Fetch API với phương thức POST
            const response = await fetch('http://localhost:3000/api/v1/ai/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });

            // Khởi tạo Reader từ ReadableStream của response body
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                // Decode đoạn byte nhận được thành chuỗi
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const dataString = line.replace('data: ', '').trim();
                        if (!dataString) continue;

                        const parsed = JSON.parse(dataString);
                        if (parsed.text) {
                            // Nhận từng ký tự/từ và nối trực tiếp vào giao diện
                            outputDiv.innerText += parsed.text;
                        }
                    }
                }
            }
        } catch (err) {
            outputDiv.innerText = 'Có lỗi xảy ra: ' + err.message;
        }
    }
</script>
</body>
</html>
